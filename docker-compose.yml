version: '3.8'
services:
  redis:
    image: redis:latest
    container_name: transaction-redis-instance
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
  zookeeper:
    image: zookeeper
    container_name: transaction-zookeeper-service
    ports:
      - "2181:2181"
  kafka:
    image: apache/kafka
    container_name: transaction-kafka-service
    ports:
      - "9092:9092"

volumes:
  redis-data:
    driver: local